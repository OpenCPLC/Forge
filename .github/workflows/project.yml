# .github/workflows/project.yml

# A project repository calls it pinned to the release that brings it:
# `uses: OpenCPLC/Forge/.github/workflows/project.yml@0.5.0`

name: Project

on:
  workflow_call:

permissions:
  contents: read

jobs:
  project:
    runs-on: windows-latest # the tools Forge installs on a developer's computer
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      # the repository in `projects/` of an empty workspace, Forge clones Core from `PRO_FRAMEWORK`
      # an event that carries no repository, perhaps a scheduled one, falls back to `project`
      - uses: actions/checkout@v4
        with:
          path: projects/${{ github.event.repository.name || 'project' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Forge of this release: the tag a project pins decides it
      - run: pip install opencplc==0.5.0
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/OpenCPLC
          key: opencplc-tools-0.5.0
      # make from Forge's tools, as a new console finds it
      - run: echo "$LOCALAPPDATA\OpenCPLC\make" >> "$GITHUB_PATH"
      # one project or a folder of them, and `**` skips hidden folders such as `.tests/`
      - name: Test and build
        run: |
          shopt -s globstar
          for main_h in projects/**/main.h; do
            name="${main_h#projects/}"
            opencplc "${name%/main.h}" -y && make test && make || exit 1
          done
